<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Ayeyarwaddy Laptop Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Section -->
  <header class="navbar">
    <div class="logo">Tech Ayeyarwaddy <span>Grade A+ Good Second</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search Laptop (e.g. Dell, i5, 16GB)...">
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
   <section class="admin-section">
    <h2>Laptop အသစ်ထည့်ရန်</h2>
    <form id="add-laptop-form">
        ...
    </form>
</section>
   <!-- Sidebar / Filters -->
    <aside class="sidebar">
      <h3>Filter Laptops</h3>
      <div class="filter-group">
        <label>Brand</label>
        <select id="brandFilter">
          <option value="all">Brands အားလုံး</option>
          <option value="Dell">Dell</option>
          <option value="Lenovo">Lenovo</option>
          <option value="Apple">Apple</option>
        </select>
      </div>
    </aside>

    <!-- Product Grid -->
    <section class="products-section">
      <h2>ရရှိနိုင်သော Laptop များ</h2>
      <div class="product-grid" id="productGrid">
        <!-- JavaScript ဖြင့် ရေးသားထားသော Laptop Cards များ ဒီနေရာမှာ ပေါ်လာမည် -->
      </div>
    </section>

  </main>
<!-- Laptop Detail Modal -->
  <div id="laptopModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div class="modal-body" id="modalBody">
        <!-- JavaScript ဖြင့် Detail များ ပြပေးမည် -->
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
