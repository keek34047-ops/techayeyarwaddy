<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Ayeyarwaddy Laptop Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo">
            <h1>Tech Ayeyarwaddy</h1>
            <p>အရည်အသွေးမြင့် ကွန်ပျူတာနှင့် Laptop များ</p>
        </div>
    </header>

    <!-- Filter Section -->
    <section class="filter-section">
        <input type="text" id="search-input" placeholder="Laptop အမျိုးအစား ရှာဖွေရန်...">
        <select id="brand-filter">
            <option value="all">Brand အားလုံး</option>
            <option value="Dell">Dell</option>
            <option value="Lenovo">Lenovo</option>
            <option value="HP">HP</option>
            <option value="Apple">Apple</option>
            <option value="Asus">Asus</option>
            <option value="Acer">Acer</option>
        </select>
    </section>

    <!-- Laptop List Section -->
    <main>
        <div id="laptop-list" class="laptop-grid">
            <!-- Laptop Data များကို JavaScript ဖြင့် ထည့်သွင်းမည် -->
        </div>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Tech Ayeyarwaddy Laptop Store. All rights reserved.</p>
        <p>ဆက်သွယ်ရန် ဖုန်း - 09-123456789</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
